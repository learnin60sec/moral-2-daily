name: Moral 2 daily video
on:
  schedule:
    - cron: "30 23 * * *"        # every day 05:00 IST (23:30 UTC)
  workflow_dispatch: {}          # "Run workflow" button for a manual run
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools and fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null
          pip install -q requests pillow numpy edge-tts imageio-ffmpeg google-auth-oauthlib google-api-python-client "kaggle>=1.7"
      - name: Secrets to files
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN_JSON" ]; then echo "$YT_TOKEN_JSON" > youtube_token.json; fi
      - name: Make today's video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE2_ACCOUNT_ID }}
          CLOUDFLARE2_API_TOKEN: ${{ secrets.CLOUDFLARE2_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          M2_MINUTES: "3"
          M2_CLIPS: "all"        # every picture becomes a 5-s AI clip (or a number, e.g. "10")
          STUDIO_UPLOAD: schedule
          STUDIO_TIMES: "18:00"
        run: python cloud_daily.py
      - name: Keep the video for download (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            FINAL_TODAY.mp4
            cloud_log.txt
          retention-days: 7
      - name: Remember used stories
        if: always()
        run: |
          git config user.name "moral2-bot"; git config user.email "bot@users.noreply.github.com"
          git add used_stories.json cloud_log.txt 2>/dev/null || true
          git commit -m "daily run ${{ github.run_number }}" || true
          git push || true
